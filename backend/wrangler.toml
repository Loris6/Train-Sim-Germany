# Train Sim Germany – Backend auf Cloudflare Workers (Anleitung: backend/README.md)
name = "tsg-backend"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
# Dieselbe Client-ID wie in assets/js/config.js (sie ist nicht geheim)
ROBLOX_CLIENT_ID = "7832208484042432028"
# Adresse der Web-App (mit / am Ende)
APP_URL = "https://loris6.github.io/Train-Sim-Germany/"
# Weitere erlaubte Adressen, mit Komma getrennt (z. B. zum Testen)
ALLOWED_ORIGINS = "http://localhost:8000"
# Roblox-Gruppe für den Rang
ROBLOX_GROUP_ID = "33684346"
# Spiel und Discord-Einladung für die echten Zahlen
ROBLOX_PLACE_ID = "140440792597921"
DISCORD_INVITE = "tvaSwbh3rE"

# Speicher für Profile, Einstellungen, Trainings, Neuigkeiten, Bewerbungen und Erinnerungen: npx wrangler kv namespace create TSG_KV
[[kv_namespaces]]
binding = "TSG_KV"
id = "HIER-DIE-KV-ID-EINTRAGEN"

# Alle 2 Minuten fällige Benachrichtigungen für Trainings verschicken
[triggers]
crons = ["*/2 * * * *"]

# Geheim, NICHT hier eintragen:
#   npx wrangler secret put DISCORD_WEBHOOK_URL           (Webhook 1: neue Bewerbungen)
#   npx wrangler secret put DISCORD_RESULTS_WEBHOOK_URL   (Webhook 2: Glückwünsche an die Bestandenen)
